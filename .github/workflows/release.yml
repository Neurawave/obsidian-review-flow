# Pushing a tag such as 0.1.0 runs the tests and creates a draft release with the files Obsidian installs.
# Review the draft on GitHub and publish it.
name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tag matches manifest.json
        run: test "$(node -p "require('./manifest.json').version")" = "${{ github.ref_name }}"
      - name: Test
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          npm ci
          npm test
      # Lets anyone verify that the release files were built from this repository:
      # gh attestation verify main.js --repo granlov/obsidian-review-flow
      - name: Attest release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --draft main.js manifest.json styles.css
